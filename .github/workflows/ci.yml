name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  identical-fingerprint:
    name: identical fingerprint (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: "22"
          - os: ubuntu-24.04
            node: "24"
          - os: ubuntu-24.04
            node: "26"
          - os: macos-15
            node: "24"
    steps:
      # The actions are pinned to exact commits so the workflow itself never changes under us.
      # The runner label names an OS release, not an immutable image, and the toolchains on it
      # float on purpose. This job exists to catch a compiler or runtime update that changes
      # the output, so every run prints the toolchain versions it used.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Record the toolchain versions used
        run: |
          uname -sm
          python3 --version
          node --version
          rustc --version

      - name: Python build
        run: python3 python/trial.py | tee py.out

      - name: TypeScript build, run natively by Node with no tsx
        run: node typescript/trial.ts | tee ts.out

      - name: Rust build
        run: |
          rustc -O rust/trial.rs -o trial_rs
          ./trial_rs | tee rs.out

      - name: The three builds must print byte-identical output
        run: |
          diff py.out ts.out
          diff py.out rs.out
          grep -qE '^CANONICAL FINGERPRINT \(seed [0-9]+, beta [0-9]+ ppm\) = [0-9a-f]{16}$' py.out
          wc -c py.out ts.out rs.out

      - name: The fingerprint must also match an independently pinned value, not just agree across languages
        run: |
          # Agreement among all three builds alone cannot catch a bug shared by all three,
          # for example if the same algorithm change were made identically in each file. This
          # pins the expected value in tests/canonical_fingerprint.txt, a single checked-in
          # fixture both builds and CI read from, so a real regression fails even if it is
          # consistent across languages, and updating the expected seed or algorithm only
          # means editing that one file, never this workflow.
          want=$(cat tests/canonical_fingerprint.txt)
          got=$(grep -oE '[0-9a-f]{16}$' py.out)
          test "$got" = "$want" || { echo "canonical fingerprint $got does not match tests/canonical_fingerprint.txt ($want)"; exit 1; }
