<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="1200" height="560" fill="#0b0d10"/>
  <text x="60" y="58" font-size="33" font-weight="700" fill="#f2efe9">Per-individual effect, agents flipped by the treatment</text>
  <text x="60" y="94" font-size="25" fill="#a8a39a">mean over 150 seeds. Lower is cleaner. Everything above the true effect is noise or desync.</text>

  <line x1="140" y1="460" x2="1150" y2="460" stroke="#262b31" stroke-width="2"/>
  <line x1="140" y1="366" x2="1150" y2="366" stroke="#161c24" stroke-width="1.5"/>
  <line x1="140" y1="272" x2="1150" y2="272" stroke="#161c24" stroke-width="1.5"/>
  <line x1="140" y1="177" x2="1150" y2="177" stroke="#161c24" stroke-width="1.5"/>
  <text x="128" y="466" font-size="23" fill="#7d786f" text-anchor="end">0</text>
  <text x="128" y="372" font-size="23" fill="#7d786f" text-anchor="end">2</text>
  <text x="128" y="278" font-size="23" fill="#7d786f" text-anchor="end">4</text>
  <text x="128" y="183" font-size="23" fill="#7d786f" text-anchor="end">6</text>

  <rect x="190" y="328" width="140" height="132" rx="4" fill="#7fa3b8"/>
  <text x="260" y="318" font-size="31" font-weight="700" fill="#7fa3b8" text-anchor="middle">2.8</text>
  <rect x="380" y="177" width="140" height="283" rx="4" fill="#7d786f"/>
  <text x="450" y="167" font-size="31" font-weight="700" fill="#a8a39a" text-anchor="middle">6.0</text>

  <rect x="720" y="328" width="140" height="132" rx="4" fill="#7fa3b8"/>
  <text x="790" y="318" font-size="31" font-weight="700" fill="#7fa3b8" text-anchor="middle">2.8</text>
  <rect x="910" y="201" width="140" height="259" rx="4" fill="#b36b5e"/>
  <text x="980" y="191" font-size="31" font-weight="700" fill="#b36b5e" text-anchor="middle">5.5</text>

  <line x1="140" y1="328" x2="1150" y2="328" stroke="#7fa3b8" stroke-width="2" stroke-dasharray="8 7" opacity="0.7"/>
  <text x="1150" y="340" font-size="23" fill="#7fa3b8" text-anchor="end">true effect 2.8</text>

  <text x="260" y="494" font-size="24" fill="#f2efe9" text-anchor="middle">Coupled twins</text>
  <text x="450" y="494" font-size="24" fill="#f2efe9" text-anchor="middle">Independent</text>
  <text x="790" y="494" font-size="24" fill="#f2efe9" text-anchor="middle">Named streams</text>
  <text x="980" y="494" font-size="24" fill="#f2efe9" text-anchor="middle">Global stream</text>

  <line x1="605" y1="120" x2="605" y2="520" stroke="#1b222b" stroke-width="2"/>
  <text x="355" y="528" font-size="25" fill="#a8a39a" text-anchor="middle">No reorder</text>
  <text x="885" y="528" font-size="25" fill="#a8a39a" text-anchor="middle">Treatment reorders work</text>
</svg>
