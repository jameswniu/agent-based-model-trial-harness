<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="1200" height="560" fill="#0b0d10"/>
  <text x="60" y="58" font-size="33" font-weight="700" fill="#e6edf3">Per-individual effect, agents flipped by the treatment</text>
  <text x="60" y="94" font-size="25" fill="#9aa7b4">mean over 150 seeds. Lower is cleaner. Everything above the true effect is noise or desync.</text>

  <line x1="140" y1="460" x2="1150" y2="460" stroke="#2a323c" stroke-width="2"/>
  <line x1="140" y1="366" x2="1150" y2="366" stroke="#161c24" stroke-width="1.5"/>
  <line x1="140" y1="272" x2="1150" y2="272" stroke="#161c24" stroke-width="1.5"/>
  <line x1="140" y1="177" x2="1150" y2="177" stroke="#161c24" stroke-width="1.5"/>
  <text x="128" y="466" font-size="23" fill="#6e7681" text-anchor="end">0</text>
  <text x="128" y="372" font-size="23" fill="#6e7681" text-anchor="end">2</text>
  <text x="128" y="278" font-size="23" fill="#6e7681" text-anchor="end">4</text>
  <text x="128" y="183" font-size="23" fill="#6e7681" text-anchor="end">6</text>

  <rect x="190" y="319" width="140" height="141" rx="4" fill="#3fb950"/>
  <text x="260" y="309" font-size="31" font-weight="700" fill="#3fb950" text-anchor="middle">3.0</text>
  <rect x="380" y="187" width="140" height="273" rx="4" fill="#6e7681"/>
  <text x="450" y="177" font-size="31" font-weight="700" fill="#9aa7b4" text-anchor="middle">5.8</text>

  <rect x="720" y="319" width="140" height="141" rx="4" fill="#3fb950"/>
  <text x="790" y="309" font-size="31" font-weight="700" fill="#3fb950" text-anchor="middle">3.0</text>
  <rect x="910" y="182" width="140" height="278" rx="4" fill="#f85149"/>
  <text x="980" y="172" font-size="31" font-weight="700" fill="#f85149" text-anchor="middle">5.9</text>

  <line x1="140" y1="319" x2="1150" y2="319" stroke="#3fb950" stroke-width="2" stroke-dasharray="8 7" opacity="0.7"/>
  <text x="1150" y="340" font-size="23" fill="#3fb950" text-anchor="end">true effect 3.0</text>

  <text x="260" y="494" font-size="24" fill="#e6edf3" text-anchor="middle">Coupled twins</text>
  <text x="450" y="494" font-size="24" fill="#e6edf3" text-anchor="middle">Independent</text>
  <text x="790" y="494" font-size="24" fill="#e6edf3" text-anchor="middle">Named streams</text>
  <text x="980" y="494" font-size="24" fill="#e6edf3" text-anchor="middle">Global stream</text>

  <line x1="605" y1="120" x2="605" y2="520" stroke="#1b222b" stroke-width="2"/>
  <text x="355" y="528" font-size="25" fill="#9aa7b4" text-anchor="middle">No reorder</text>
  <text x="885" y="528" font-size="25" fill="#9aa7b4" text-anchor="middle">Treatment reorders work</text>
</svg>
