<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="SFMono-Regular,Consolas,Menlo,monospace">
  <rect width="1200" height="620" fill="#0b0d10"/>
  <rect x="40" y="36" width="1120" height="548" rx="12" fill="#0d1117" stroke="#2a323c" stroke-width="2"/>
  <rect x="40" y="36" width="1120" height="46" rx="12" fill="#151a21"/>
  <rect x="40" y="70" width="1120" height="12" fill="#151a21"/>
  <circle cx="72" cy="59" r="7" fill="#f85149"/>
  <circle cx="98" cy="59" r="7" fill="#f5b342"/>
  <circle cx="124" cy="59" r="7" fill="#3fb950"/>
  <text x="600" y="66" font-size="22" fill="#9aa7b4" text-anchor="middle">trial.py</text>
  <text x="70" y="132" font-size="23" fill="#e6edf3" xml:space="preserve">$ python3 trial.py</text>
  <text x="70" y="192" font-size="23" fill="#f5b342" xml:space="preserve">=== correctness checks ===</text>
  <text x="70" y="224" font-size="23" fill="#3fb950" xml:space="preserve">[PASS] replay reproduces the manifest hash</text>
  <text x="70" y="256" font-size="23" fill="#3fb950" xml:space="preserve">[PASS] placebo arm is byte-identical to control</text>
  <text x="70" y="288" font-size="23" fill="#3fb950" xml:space="preserve">[PASS] named streams survive an order change</text>
  <text x="70" y="320" font-size="23" fill="#3fb950" xml:space="preserve">[PASS] global stream desyncs on an order change, as expected</text>
  <text x="70" y="380" font-size="23" fill="#f5b342" xml:space="preserve">=== per-agent effect, agents flipped by the treatment ===</text>
  <text x="70" y="412" font-size="23" fill="#c9d4df" xml:space="preserve">coupled twins (named, CRN)      <tspan fill="#3fb950">2.8</tspan> agents differ, the real effect</text>
  <text x="70" y="444" font-size="23" fill="#c9d4df" xml:space="preserve">independent runs                <tspan fill="#9aa7b4">6.0</tspan> agents differ, mostly chance noise</text>
  <text x="70" y="504" font-size="23" fill="#f5b342" xml:space="preserve">=== when the treatment reorders work ===</text>
  <text x="70" y="536" font-size="23" fill="#c9d4df" xml:space="preserve">named streams stay coupled      <tspan fill="#3fb950">2.8</tspan> agents differ (true effect)</text>
  <text x="70" y="568" font-size="23" fill="#c9d4df" xml:space="preserve">global stream loses coupling    <tspan fill="#f85149">5.5</tspan> agents differ (spurious)</text>
</svg>
